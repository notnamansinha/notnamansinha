<tspan x="430" y="790" class="cc">                (deleted </tspan><tspan class="delColor" id="loc_del">132,626</tspan><tspan class="cc"> — refactor)</tspan>
<tspan x="430" y="810" class="key">repos         </tspan><tspan class="cc">: </tspan><tspan class="value"><tspan id="repo_data">12</tspan> own + <tspan id="contrib_data">17</tspan> contribs</tspan>
<tspan x="430" y="830" class="key">shipped       </tspan><tspan class="cc">: </tspan><tspan class="value">1 live product</tspan>
<tspan x="430" y="850" class="cc">                (the one that matters)</tspan>
