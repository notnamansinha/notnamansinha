<text x="430" y="30" fill="#24292f">
<tspan x="430" y="30" font-weight="bold">notnamansinha</tspan>
<tspan x="430" y="50" class="cc">notnamansinha@github</tspan>
<tspan x="430" y="70" class="sep">──────────────────────────────────────────</tspan>
<tspan x="430" y="90" class="key">OS        </tspan><tspan class="cc">: </tspan><tspan class="value">Linux Mint / Windows 11</tspan>
<tspan x="430" y="110" class="key">IDE       </tspan><tspan class="cc">: </tspan><tspan class="value">VS Code, vim, Neovim</tspan>
<tspan x="430" y="130" class="key">Terminal  </tspan><tspan class="cc">: </tspan><tspan class="value">Windows Terminal, git bash,</tspan>
<tspan x="430" y="150" class="value">            warp, vim</tspan>
<tspan x="430" y="170" class="sep">──────────────────────────────────────────</tspan>
<tspan x="430" y="190" class="key">Stack     </tspan><tspan class="cc">: </tspan><tspan class="value">Python · C · C++ · TypeScript ·</tspan>
<tspan x="430" y="210" class="value">            JavaScript · Node</tspan>
<tspan x="430" y="230" class="key">Frontend  </tspan><tspan class="cc">: </tspan><tspan class="value">React 19 · Tailwind CSS ·</tspan>
<tspan x="430" y="250" class="value">            Framer Motion · Firebase</tspan>
<tspan x="430" y="270" class="sep">──────────────────────────────────────────</tspan>
<tspan x="430" y="290" font-weight="bold">what i'm building</tspan>
<tspan x="430" y="310" class="value">naknav.in — live, Ahmedabad</tspan>
<tspan x="430" y="330" class="cc" font-size="13px">navigation tool deployed and used in the</tspan>
<tspan x="430" y="345" class="cc" font-size="13px">real world. not a portfolio piece.</tspan>
<tspan x="430" y="375" class="value">BRTS-Navigator</tspan>
<tspan x="430" y="395" class="cc" font-size="13px">graph-based route planner for</tspan>
<tspan x="430" y="410" class="cc" font-size="13px">Ahmedabad's BRTS network.</tspan>
<tspan x="430" y="430" class="cc" font-size="13px">shortest-path over real stops, real</tspan>
<tspan x="430" y="445" class="cc" font-size="13px">routes — O(V+E) on GTFS data.</tspan>
<tspan x="430" y="475" class="sep">──────────────────────────────────────────</tspan>
<tspan x="430" y="495" font-weight="bold">skills (honest edition)</tspan>
<tspan x="430" y="515" class="key">area              </tspan><tspan class="key">actually use</tspan>
<tspan x="430" y="535" class="key">systems           </tspan><tspan class="value">memory management, graph</tspan>
<tspan x="430" y="555" class="value">                  algorithms, CLI tooling</tspan>
<tspan x="430" y="575" class="key">backend/devops    </tspan><tspan class="value">REST APIs, Firebase, Git,</tspan>
<tspan x="430" y="595" class="value">                  Linux, Windows</tspan>
<tspan x="430" y="615" class="key">domain knowledge  </tspan><tspan class="value">real-time transit tracking,</tspan>
<tspan x="430" y="635" class="value">                  market data pipelines</tspan>
<tspan x="430" y="665" class="cc" font-style="italic" font-size="14px">C/C++ means I've debugged segfaults</tspan>
<tspan x="430" y="680" class="cc" font-style="italic" font-size="14px">at 2am. That counts.</tspan>
<tspan x="430" y="710" class="sep">──────────────────────────────────────────</tspan>
<tspan x="430" y="730" font-weight="bold">numbers that mean something</tspan>
<tspan x="430" y="750" class="key">commits       </tspan><tspan class="cc">: </tspan><tspan class="value"><tspan id="commit_data">550</tspan> (not padded)</tspan>
